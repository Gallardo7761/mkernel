scripts:
  admin_stick:
    events:
      LEFT_CLICK_ENTITY:
        - condition: "always"
          actions:
            - "cancel_event"
            - "kill_entity"

  scissors:
    properties:
      creeper_chance: 10
      animal_chance: 100
      zombie_chance: 50
    events:
      RIGHT_CLICK_ENTITY:
        - condition: "target_is:CREEPER"
          actions:
            - "action_if_chance(creeper_chance, [kill_entity, sound(ENTITY_SHEEP_SHEAR, 1.0, 1.0), firework(LIME, BURST), drop_item(VINE, 1), drop_item(GUNPOWDER, 1)], [damage_item(1)])"

        - condition: "target_is:PIG"
          actions:
            - "action_if_chance(animal_chance, [sound(ENTITY_SHEEP_SHEAR, 1.0, 1.0), set_baby, drop_item(PORKCHOP, 1), damage_item(2)], [])"

        - condition: "target_is:COW"
          actions:
            - "action_if_chance(animal_chance, [sound(ENTITY_SHEEP_SHEAR, 1.0, 1.0), set_baby, drop_item(BEEF, 1), damage_item(2)], [])"

        - condition: "target_is:ZOMBIE"
          actions:
            - "action_if_chance(zombie_chance, [sound(ENTITY_SHEEP_SHEAR, 1.0, 1.0), transform_entity(SKELETON), drop_item(ROTTEN_FLESH, 1), damage_item(2)], [])"

  spawner_breaker:
    properties:
      break_probability: 30
    events:
      BLOCK_BREAK:
        - condition: "block_type:SPAWNER"
          actions:
            - "cancel_event"
            - "action_if_chance(break_probability, [drop_spawner, break_block, clear_hand, sound(BLOCK_ANVIL_USE, 1.0, 1.0)], [clear_hand, sound(ENTITY_ITEM_BREAK, 1.0, 1.0)])"

  zombification_potion:
    events:
      POTION_SPLASH:
        - condition: "target_is:VILLAGER"
          actions:
            - "zombify"
            - "sound(ENTITY_ZOMBIE_VILLAGER_CURE, 1.0, 0.5)"