# -----------------------------------------------------------
#  Plugin Configuration [ R ]
# -----------------------------------------------------------
config:
  permissions:
    chatFormat: "mkernel.events.chatformat"
    adminChat: "mkernel.events.adminchat"
    mentions: "mkernel.events.mentions"

  values:
    recInvRequiredLevel: 10
    xpLossOnDeath: 0.7
    tpCooldown: "5m"
    maxWarps: 3
    recInvPlayerRadius: 10
    recInvSpawnDistance: 150

  chat:
    prefix: "<color:#d30000><bold>MKernel</bold> <white>»</white></color>"
    public:
      format: "%vault_prefix% <white>%player_name%</white> <aqua>»</aqua> <reset><message>"
    admin:
      trigger: "#"
      format: "<color:#d30000><bold>AdminChat</bold> <white>%player_name%</white> <light_purple>»</light_purple> <reset><message>"

  blacklist:
    commands:
      - /minecraft:me
    recipes: []

  modules:
    joinTitle: true
    leaveTitle: true
    deathTitle: true
    harvestOnRightClick: true
    autoItemRefill: true
    adminChat: true
    chatFormat: true
    mentions: true
    bookColors: true
    signColors: true
    spawnAtLobby: true
    recoverInventory: true
    endermanNWordAnger: true
    noNetherPortals: true

  sequentialCommands:
    _example:
      - command: "say example"
        delay: 0
      - command: "say delay"
        delay: 2

  worlds:
    lobby:
      name: "lobby"
      coords:
        x: 0.5
        y: 65
        z: 0.5
        yaw: 180
        pitch: 0

# -----------------------------------------------------------
#  Command Configuration [ R ]
# -----------------------------------------------------------
arguments:
  reload: "recargar"
  password: "contraseña"
  player: "jugador"
  levels: "niveles"
  times: "veces"
  world: "mundo"
  message: "mensaje"
  item: "item"
  inventoryIndex: "índice de inventario"
  warpName: "nombre warp"
  warp: "warp"
  speed: "velocidad"
  sequence: "secuencia"

commands:
  mkernel:
    description: "Muestra la información de mkernel"
    permission: "mkernel.command"
    usage: "/mkernel [subcomando]"
    subcommands:
      reload:
        name: "reload"
        description: "Recarga mkernel"
        permission: "mkernel.command.reload"
        usage: "/mkernel reload"
        messages:
          success: "mkernel ha sido recargado correctamente"
          error: "Ha ocurrido un error al recargar mkernel"
      config:
        name: "config"
        description: "Abre el menú de configuración"
        permission: "mkernel.command.config"
        usage: "/mkernel config"

  tpa:
    name: "tpa"
    description: "Envía una petición de teletransporte"
    permission: "mkernel.command.tpa"
    usage: "/tpa <jugador>"
    messages:
      tpaFromPlayer: "<gray>El jugador <green><sender></green> te ha enviado una petición de teletransporte <red>[<sender> -> Tú]</red></gray>\n<dark_gray>» </dark_gray><click:run_command:'/tpaccept <sender>'><hover:show_text:'<green>Aceptar petición</green>'><bold><green>[ACEPTAR]</green></bold></hover></click>  <click:run_command:'/tpdeny <sender>'><hover:show_text:'<red>Rechazar petición</red>'><bold><red>[RECHAZAR]</red></bold></hover></click>"
      tpaToPlayer: "<gray>Has enviado una petición de teletransporte a <green><target></green> <red>[Tú -> <target>]</red></gray>"

  tpahere:
    name: "tpahere"
    description: "Envía una petición de teletransporte a un jugador"
    permission: "mkernel.command.tpahere"
    usage: "/tpahere <jugador>"
    messages:
      tpaFromPlayer: "<gray>El jugador <green><sender></green> te ha enviado una petición de teletransporte <red>[Tú -> <sender>]</red></gray>\n<dark_gray>» </dark_gray><click:run_command:'/tpaccept <sender>'><hover:show_text:'<green>Aceptar petición</green>'><bold><green>[ACEPTAR]</green></bold></hover></click>  <click:run_command:'/tpdeny <sender>'><hover:show_text:'<red>Rechazar petición</red>'><bold><red>[RECHAZAR]</red></bold></hover></click>"
      tpaToPlayer: "<gray>Has enviado una petición de teletransporte a <green><target></green> <red>[<target> -> Tú]</red></gray>"

  tpaccept:
    name: "tpaccept"
    description: "Acepta una petición de teletransporte"
    permission: "mkernel.command.tpaccept"
    usage: "/tpaccept <jugador>"
    messages:
      accepted: "<gray>Has aceptado la petición de teletransporte</gray>"
      acceptedToTarget: "<gray>El jugador <green><sender></green> ha aceptado tu petición de teletransporte</gray>"

  tpdeny:
    name: "tpdeny"
    description: "Rechaza una petición de teletransporte"
    permission: "mkernel.command.tpdeny"
    usage: "/tpdeny <jugador>"
    messages:
      denied: "<gray>Has rechazado la petición de teletransporte</gray>"
      deniedToTarget: "<gray>El jugador <green><sender></green> ha rechazado tu petición de teletransporte</gray>"

  spawn:
    name: "spawn"
    description: "Teletransportate a ti o a otro jugador al spawn"
    permissions:
      base: "mkernel.command.spawn"
      others: "mkernel.command.spawn.others"
    messages:
      teleported: "<gray>Has sido teletransportado al spawn</gray>"
      spawnYouOthers: "<gray>Has teletransportado a <green><target></green> al spawn</gray>"
      spawnOthersYou: "<gray>Has sido teletransportado al spawn por <green><sender></green></gray>"

  lobby:
    name: "lobby"
    description: "Teletransportate al lobby"
    permissions:
      base: "mkernel.command.lobby"
      others: "mkernel.command.lobby.others"
    messages:
      teleported: "<gray>Has sido teletransportado al lobby</gray>"
      lobbyYouOthers: "<gray>Has teletransportado a <green><target></green> al lobby</gray>"
      lobbyOthersYou: "<gray>Has sido teletransportado al lobby por <green><sender></green></gray>"

  sendcoords:
    name: "sendcoords"
    description: "Envía tus coordenadas a otro jugador"
    permission: "mkernel.command.sendcoords"
    usage: "/sendcoords <jugador>"
    messages:
      sent: "<gray>Tus coordenadas han sido enviadas a <green><target></green></gray>"
      coordsMsg: "<dark_gray>[<red><sender></red> -> <red>Tú</red>]</dark_gray> <gray>Mis coordenadas son:</gray>\n<click:copy_to_clipboard:'<x> <y> <z>'><hover:show_text:'<yellow>Click para copiar!</yellow>'><green>X:</green> <gray><x></gray> <green>Y:</green> <gray><y></gray> <green>Z:</green> <gray><z></gray></hover></click>"

  blockworld:
    name: "blockworld"
    aliases: ["bworld", "bw"]
    description: "Bloquea un mundo"
    permission: "mkernel.command.blockworld"
    usage: "/blockworld | /bworld | /bw <mundo>"
    messages:
      worldHasBeenBlocked: "<gray>El mundo <green><world></green> ha sido bloqueado</gray>"
      worldHasBeenUnblocked: "<gray>El mundo <green><world></green> ha sido desbloqueado</gray>"

  payxp:
    name: "payxp"
    description: "Paga niveles de XP a otro jugador"
    permission: "mkernel.command.payxp"
    usage: "/payxp <jugador> <niveles>"
    messages:
      payYouOthers: "<gray>Has pagado <green><amount></green> niveles de XP a <green><target></green></gray>"
      payOthersYou: "<gray>El jugador <green><sender></green> te ha dado <green><amount></green> niveles de XP</gray>"

  specialitem:
    name: "specialitem"
    description: "Obtiene un item especial de mkernel"
    permission: "mkernel.command.specialitem"
    usage: "/specialitem <item>"
    messages:
      itemReceived: "<gray>Has obtenido <green><item></green></gray>"

  opme:
    name: "opme"
    description: "Te da el op"
    permission: "mkernel.command.opme"
    messages:
      opped: "<gray>Ahora eres <green><u>op</u></green></gray>"
      alreadyOp: "<red>Ya eres op</red>"

  deopme:
    name: "deopme"
    description: "Te quita el op"
    permission: "mkernel.command.deopme"
    messages:
      deOpped: "<gray>Ya no eres <green><u>op</u></green></gray>"
      youAreNotOp: "<red>No eres op</red>"

  disposal:
    name: "disposal"
    description: "Abre el disposal"
    permissions:
      base: "mkernel.command.disposal"
      others: "mkernel.command.disposal.others"

  globalchest:
    name: "globalchest"
    description: "Abre el cofre global"
    aliases: ["gc"]
    permissions:
      base: "mkernel.command.globalchest"
      others: "mkernel.command.globalchest.others"

  do:
    name: "do"
    description: "Acciones de entorno"
    permission: "mkernel.command.do"

  me:
    name: "me"
    description: "Acciones de personaje"
    permission: "mkernel.command.me"

  sethome:
    name: "sethome"
    description: "Establece tu home"
    permission: "mkernel.command.sethome"
    messages:
      homeSet: "<gray>Hogar establecido en <green><x> <y> <z></green></gray>"

  home:
    name: "home"
    description: "Teletransportate a tu hogar"
    permission: "mkernel.command.home"
    messages:
      teleported: "<gray>Has sido teletransportado a tu hogar</gray>"
      homeDoesNotExist: "<red>No tienes ningún hogar establecido</red>"

  recinv:
    name: "recinv"
    description: "Recupera tu inventario"
    permission: "mkernel.command.recinv"
    messages:
      inventoryRecovered: "<gray>Has recuperado <green><items></green> items</gray>"
      notEnoughLevels: "<red>No tienes suficientes niveles. Necesitas <green><required></green></red>"
      noItemsToRecover: "<red>No hay items que recuperar</red>"

  gmc:
    name: "gmc"
    description: "Cambia tu modo de juego a creativo"
    permissions:
      base: "mkernel.command.gmc"
      others: "mkernel.command.gmc.others"
    usage: "/gmc [jugador]"
    messages:
      self: "<gray>Tu modo de juego ha sido cambiado a <green>Creativo</green></gray>"
      others: "<gray>El modo de juego de <green><player></green> ha sido cambiado a <green>Creativo</green></gray>"

  gms:
    name: "gms"
    description: "Cambia tu modo de juego a supervivencia"
    permissions:
      base: "mkernel.command.gms"
      others: "mkernel.command.gms.others"
    usage: "/gms [jugador]"
    messages:
      self: "<gray>Tu modo de juego ha sido cambiado a <green>Supervivencia</green></gray>"
      others: "<gray>El modo de juego de <green><player></green> ha sido cambiado a <green>Supervivencia</green></gray>"

  gmsp:
    name: "gmsp"
    description: "Cambia tu modo de juego a espectador"
    permissions:
      base: "mkernel.command.gmsp"
      others: "mkernel.command.gmsp.others"
    usage: "/gmsp [jugador]"
    messages:
      self: "<gray>Tu modo de juego ha sido cambiado a <green>Espectador</green></gray>"
      others: "<gray>El modo de juego de <green><player></green> ha sido cambiado a <green>Espectador</green></gray>"

  gma:
    name: "gma"
    description: "Cambia tu modo de juego a aventura"
    permissions:
      base: "mkernel.command.gma"
      others: "mkernel.command.gma.others"
    usage: "/gma [jugador]"
    messages:
      self: "<gray>Tu modo de juego ha sido cambiado a <green>Aventura</green></gray>"
      others: "<gray>El modo de juego de <green><player></green> ha sido cambiado a <green>Aventura</green></gray>"

  vanish:
    name: "vanish"
    description: "Desaparece"
    permission: "mkernel.command.vanish"
    messages:
      vanished: "<gray>Te has hecho invisible</gray>"
      unvanished: "<gray>Ahora eres visible de nuevo</gray>"

  warp:
    name: "warp"
    description: "Muestra un warp de la lista"
    permission: "mkernel.command.warp"
    usage: "/warp {add/remove} <nombre warp>"
    messages:
      noWarpsStored: "<red>No tienes warps almacenados</red>"
      warpList: |
        <gray>Warps almacenados:</gray>
        <warps>
    subcommands:
      add:
        name: "add"
        description: "Añade un warp"
        permission: "mkernel.command.warp.add"
        usage: "/warp add <nombre>"
        messages:
          warpAdded: "<gray>Warp <green><warp></green> añadido correctamente</gray>"
          warpAlreadyExists: "<red>El warp <green><warp></green> ya existe</red>"
      remove:
        name: "remove"
        description: "Elimina un warp"
        permission: "mkernel.command.warp.remove"
        usage: "/warp remove <nombre>"
        messages:
          warpRemoved: "<gray>Warp <green><warp></green> eliminado correctamente</gray>"
          warpNotFound: "<red>El warp <green><warp></green> no existe</red>"

  spy:
    name: "spy"
    description: "Espía los mensajes de chat"
    permission: "mkernel.command.spy"
    messages:
      enabled: "<gray>Modo espía <green>activado</green></gray>"
      disabled: "<gray>Modo espía <green>desactivado</green></gray>"

  freeze:
    name: "freeze"
    description: "Congela a un jugador"
    permission: "mkernel.command.freeze"
    usage: "/freeze <jugador>"
    messages:
      frozen: "<gray>El jugador <green><player></green> ha sido <aqua>congelado</aqua></gray>"
      unfrozen: "<gray>El jugador <green><player></green> ha sido <aqua>descongelado</aqua></gray>"
      beenFrozen: "<gray>Has sido <aqua>congelado por <green><sender></green></aqua></gray>"
      beenUnfrozen: "<gray>Has sido <aqua>descongelado por <green><sender></green></aqua></gray>"

  heal:
    name: "heal"
    description: "Cura a un jugador"
    permissions:
      base: "mkernel.command.heal"
      others: "mkernel.command.heal.others"
    usage: "/heal <jugador>"
    messages:
      healedSelf: "<gray>Te has curado</gray>"
      healedPlayer: "<gray>Has curado a <green><player></green></gray>"
      beenHealed: "<gray>Has sido curado por <green><sender></green></gray>"

  launch:
    name: "launch"
    description: "Lanza a un jugador"
    permission: "mkernel.command.launch"
    usage: "/launch <jugador>"
    messages:
      launched: "<gray>Has lanzado a <green><player></green></gray>"

  sun:
    name: "sun"
    description: "Cambia el clima a soleado"
    permission: "mkernel.command.sun"
    messages:
      sunSet: "<gray>Se ha cambiado el clima a <green>soleado</green></gray>"

  rain:
    name: "rain"
    description: "Cambia el clima a lluvioso"
    permission: "mkernel.command.rain"
    messages:
      rainSet: "<gray>Se ha cambiado el clima a <green>lluvioso</green></gray>"

  thunder:
    name: "thunder"
    description: "Cambia el clima a tormentoso"
    permission: "mkernel.command.thunder"
    messages:
      thunderSet: "<gray>Se ha cambiado el clima a <green>tormentoso</green></gray>"

  day:
    name: "day"
    description: "Pone el tiempo a día"
    permission: "mkernel.command.day"
    messages:
      daySet: "<gray>Ahora es de <green>día</green></gray>"

  night:
    name: "night"
    description: "Pone el tiempo a noche"
    permission: "mkernel.command.night"
    messages:
      nightSet: "<gray>Ahora es de <green>noche</green></gray>"

  invsee:
    name: "invsee"
    description: "Mira el inventario de un jugador"
    permission: "mkernel.command.invsee"
    usage: "/invsee <jugador>"
    messages:
      opened: "<gray>Has abierto el inventario de <green><player></green></gray>"

  back:
    name: "back"
    description: "Vuelve a tu posición anterior"
    permission: "mkernel.command.back"
    usage: "/back"
    messages:
      success: "<gray>Has vuelto a tu posición anterior</gray>"

  flyspeed:
    name: "flyspeed"
    aliases: ["fspeed"]
    description: "Modifica tu velocidad de vuelo"
    permission: "mkernel.command.flyspeed"
    usage: "/fspeed <velocidad>"
    messages:
      changed: "<gray>Se ha cambiado tu velocidad de vuelo a <green><speed></green></gray>"
      reset: "<gray>Tu velocidad de vuelo vuelve a ser normal</gray>"

  sequence:
    name: "sequence"
    aliases: ["s", "seq"]
    description: "Ejecuta una secuencia de comandos"
    permission: "mkernel.command.sequence"
    usage: "/sequence <secuencia>"
    messages:
      success: "<gray>Se ha ejecutado la secuencia <green><name></green></gray>"
      error: "<red>Ha ocurrido un error al ejecutar la secuencia <green><name></green></red>"

