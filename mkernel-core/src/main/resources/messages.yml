# -----------------------------------------------------------
#  MKernel - Language & Texts
# -----------------------------------------------------------

general:
  unknown: "desconocido"
  titles:
    format: "<color:#d30000><bold><player></bold></color>"
    join: "<green>Ha entrado al servidor!</green>"
    leave: "<red>Se ha ido del servidor!</red>"
    death: "<red><player> ha muerto</red>"
  errors:
    langs: "<red>Error creando los archivos de lenguaje</red>"
    notConsoleCommand: "<red>Este comando no se puede ejecutar desde la consola</red>"
    onlyPlayerCommand: "<red>Este comando sólo lo puede ejecutar un jugador</red>"
    playerNotFound: "<red>El jugador no se ha encontrado o no está conectado</red>"
    noPermission: "<red>No tienes permisos para eso</red>"
    tooManyArguments: "<red>Demasiados argumentos</red>"
    playerRequired: "<red>Debes especificar un jugador</red>"
    invalidArgument: "<red>Argumento no válido</red>"
    temporarilyDisabled: "<red>Este comando está temporalmente desactivado</red>"
    notANumber: "<red>Eso no es un número válido</red>"
    notEnoughLevels: "<red>No tienes suficientes niveles. Necesitas <green><required></green></red>"

inventories:
  globalChestTitle: "Cofre global"
  disposalTitle: "Basura"
  invseeTitle: "Inventario de <player>"
  configMenu:
    title: "Configuración"
    subTitle: "<dark_gray>Configuración <dark_gray>» <module>"
    valueName: "<color:#d30000><bold>"
    valueLore: "<gray>Valor: <color:#d30000>"

    moduleName: "<italic:false><state_color><bold><module>"
    moduleLoreState: "<italic:false><gray>Estado: <state>"
    moduleLoreHint: "<italic:false><yellow>Click para gestionar »"

    stateEnabledColor: "<green>"
    stateDisabledColor: "<red>"
    stateEnabledText: "<green>Activado"
    stateDisabledText: "<red>Desactivado"

    toggleName: "<italic:false><bold>Módulo <state>"
    toggleStateEnabled: "<green><bold>ACTIVADO"
    toggleStateDisabled: "<red><bold>DESACTIVADO"
    toggleLore: "<italic:false><gray>Click para <action> todo el módulo"

    actionEnable: "activar"
    actionDisable: "desactivar"

    backName: "<italic:false><yellow>« Volver"

modules:
  core:
    _meta:
      name: "Core"
      icon: "ENDER_CHEST"

  connection:
    _meta:
      name: "Conexión"
      icon: "END_ROD"
    joinMessage: "<yellow><player> se ha unido a la partida"
    leaveMessage: "<yellow><player> ha abandonado la partida"

  chat:
    _meta:
      name: "Chat"
      icon: "WRITABLE_BOOK"
    mentionFormat: "<color:#d30000><bold>@<player></bold></color>"
    youWereMentioned: "<yellow><player></yellow> <gray>te ha mencionado!</gray>"

  shops:
    _meta:
      name: "Tiendas"
      icon: "EMERALD"
    hologram:
      title: "<red><bold>TIENDA</bold></red>"
      price: "<white>Precio:</white> <yellow><price></yellow> <green>♦"
      stock: "<white>Stock:</white> <yellow><stock></yellow>"
    inventory:
      title: "Tienda de <owner>"
      itemLore:
        - "<italic:false><gray>Precio unidad: <yellow><price> <green>♦"
        - "<italic:false><gray>Stock disponible: <aqua><stock>"
        - "<italic:false><dark_gray>(<tax_percent>% IVA incluído)"
        - ""
        - "<italic:false><green>  ► Click Izq: <white>Comprar 1"
        - "<italic:false><green>  ► Click Der: <white>Comprar 32"
        - "<italic:false><green>  ► Shift + Click Izq: <white>Comprar 64"
        - "<italic:false><green>  ► Q / Soltar: <white>Comprar TODO"
    chat:
      placed: "<yellow>Escribe el precio por unidad en el chat (ej: 10.5):"
      created: "<gray>Tienda de <green><item> creada</green>! Para introducir stock, <green>ábrela</green></gray>"
      buy: "<gray>Has comprado <green><amount>x</green> por <green><total_price> <green>%banco_suffix%</green> <dark_gray>(<tax_percent>% IVA incl.)</dark_gray></gray>"
      sold: "<gray><green><buyer></green> te ha comprado <aqua><amount>x <item></aqua> por <yellow><total_price> %banco_suffix%</yellow> <dark_gray>(Impuestos: <red>-<tax></red> | Neto: <green>+<profit></green>)</dark_gray></gray>"
      destroy: "<gray>Has destruido la tienda. Los items se han soltado.</gray>"
    errors:
      noStock: "<red>Esta tienda se ha quedado sin stock</red>"
      noEconomy: "<red>Error: El sistema de economía no está disponible</red>"
      notEnoughMoney: "<red>No tienes suficiente dinero</red>"
      shopNotAccessible: "<red>El cofre de la tienda no es accesible.</red>"
      errorBuyingItem: "<red>No se pudo comprar el item</red>"
      inventoryFull: "<red>Inventario lleno</red>"
      cantBuyOwn: "<red>No puedes comprar de tu propia tienda</red>"

  teleport:
    _meta:
      name: "TP"
      icon: "ENDER_PEARL"
    errors:
      cantTeleportToYourself: "<red>No puedes teletransportarte a ti mismo</red>"
      requestAlreadySent: "<red>Ya has enviado una petición de teletransporte a este jugador</red>"
      noRequestFound: "<red>No tienes ninguna petición de teletransporte</red>"
      lobbyDoesNotExist: "<red>El lobby definido en el config no existe</red>"
      cooldownHasNotExpired: "<red>Debes esperar <time> segundos para volver a usar este comando</red>"
      maxWarpsReached: "<red>Has alcanzado el límite de warps almacenados</red>"
      noLastPosition: "<red>No tienes una última posición a la que volver</red>"

  death:
    _meta:
      name: "Muerte"
      icon: "SKELETON_SKULL"
    chat:
      lostLevelsItems: "<gray>Has perdido <green>tus items</green> y <green><levels> niveles de XP</green> al morir. Puedes recuperarlas con </gray><click:suggest_command:'/recinv'><hover:show_text:'<green>Haz click para escribir /recinv</green>'><green><u>/recinv</u></green></hover></click>"
      itemsNotRecovered: "<gray>Tus items no se han recuperado porque has muerto muy cerca del spawn/point o había jugadores cerca tuya. Los puedes recuperar en: <green><x> <y> <z></green></gray>"
    errors:
      noItemsToRecover: "<red>No hay items que recuperar</red>"

  admin:
    _meta:
      name: "Admin"
      icon: "NETHERITE_SWORD"
    spyMessage: "<gray><i>[Spy] <click:run_command:'/tp <player>'><hover:show_text:'<red>Jugador:</red> <white><player></white>\n<yellow>Haz click para hacer TP</yellow>'><red><player></red></hover></click>: <message></i></gray>"
    whileFrozen: "<red>No puedes hacer esto mientras estás congelado</red>"
    errors:
      cannotFreezeSelf: "<red>No te puedes congelar a ti mismo</red>"
      worldIsBlocked: "<gray>El mundo <green><world></green> está bloqueado</gray>"

  player:
    _meta:
      name: "Jugador"
      icon: "PLAYER_HEAD"

  misc:
    errors:
      itemNotFound: "<red>No se ha encontrado el item</red>"
      nickBlacklisted: "<red>Este nickname está prohibido</red>"

  world:
    _meta:
      name: "Mundo"
      icon: "GRASS_BLOCK"
    illegalPortal: "<red>No puedes crear portales, deberás usar el portal comunitario. Este intento ha sido registrado por el Ministerio de Portales.</red>"

file-version: 3