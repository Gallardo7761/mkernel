name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: catthehacker/ubuntu:act-latest
    defaults:
      run:
        shell: bash
    env:
      GITEA_URL: ${{ vars.GITEA_URL || 'https://git.killobyte.es' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Versioning
        id: version
        run: |
          VERSION=$(sed -n 's/^ *version = "\(.*\)"$/\1/p' build.gradle.kts | head -n 1)
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::La versión de build.gradle.kts no es CalVer (year.month.update): '$VERSION'"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::v$VERSION ya está publicada. Sube la versión en build.gradle.kts."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :nucleo-public:shadowJar --no-daemon

      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PREVIOUS=$(git describe --tags --abbrev=0 2>/dev/null || true)
          RANGE=${PREVIOUS:+$PREVIOUS..}HEAD
          git log "$RANGE" --no-merges --pretty='- %s' | grep -vE '\((priv)\)' > notes.md || true
          [ -s notes.md ] || echo "- Sin cambios en el core" > notes.md
          cat notes.md

      - name: Gitea release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TOKEN: ${{ secrets.GITEA_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
        run: |
          set -eo pipefail
          JAR="nucleo-public/build/libs/nucleo-$VERSION.jar"
          [ -f "$JAR" ] || { echo "::error::No se ha generado $JAR"; exit 1; }

          api() { curl -fsS -H "Authorization: token $TOKEN" "$@"; }

          # Borradores de esta versión que hayan quedado de una ejecución fallida
          api "$API/releases?draft=true&limit=50" \
            | jq -r --arg tag "v$VERSION" '.[] | select(.draft and .tag_name == $tag) | .id' \
            | while read -r OLD_ID; do api -X DELETE "$API/releases/$OLD_ID"; done

          # Borrador: Gitea no crea el tag hasta que se publica
          RELEASE_ID=$(jq -n \
              --arg tag "v$VERSION" \
              --arg target "$GITHUB_SHA" \
              --arg name "Nucleo $VERSION" \
              --rawfile body notes.md \
              '{tag_name: $tag, target_commitish: $target, name: $name, body: $body, draft: true, prerelease: false}' \
            | api -X POST "$API/releases" -H "Content-Type: application/json" -d @- \
            | jq -r '.id')
          trap 'api -X DELETE "$API/releases/$RELEASE_ID" || true' ERR

          api -X POST "$API/releases/$RELEASE_ID/assets?name=nucleo-$VERSION.jar" \
            -F "attachment=@$JAR" > /dev/null

          api -X PATCH "$API/releases/$RELEASE_ID" \
            -H "Content-Type: application/json" -d '{"draft": false}' > /dev/null
          trap - ERR

          echo "Publicada v$VERSION: $GITEA_URL/${{ github.repository }}/releases/tag/v$VERSION"
