# -----------------------------------------------------------
#  Nucleo - Main Configuration
# -----------------------------------------------------------

modules:
  core:
    enabled: true
    commands:
      disposal: true
      globalchest: true
      payxp: true
      sendcoords: true
      nick: true

  admin:
    enabled: true
    chat: true
    commands:
      specialItem: true
      invsee: true
      gma: true
      gmsp: true
      gmc: true
      gms: true
      heal: true
      opme: true
      deopme: true
      spy: true
      vanish: true
      sequence: true
      flyspeed: true
      freeze: true

  chat:
    enabled: true
    format: true
    mentions: true
    roleplay: true
    endermanAnger: true

  shop:
    enabled: true

  teleport:
    enabled: true
    spawnAtLobby: true

  player:
    enabled: true
    joinTitle: true
    leaveTitle: true
    deathTitle: true
    recoverInventory: true

  world:
    enabled: true
    harvestRightClick: true
    autoItemRefill: true
    noNetherPortals: true
    timeWeatherControl: true

  environment:
    enabled: true
    temperatureEffects: true

settings:
  permissions:
    chatFormat: "nucleo.events.chatformat"
    adminChat: "nucleo.events.adminchat"
    mentions: "nucleo.events.mentions"

  shops:
    taxPercent: 21.0
    serverAccount: "Hacienda"
    permissions:
      admin: "nucleo.shop.admin"

  teleport:
    tpCooldown: "5m"
    maxWarps: 3

  death:
    xpLossOnDeath: 0.7
    recoverInventory:
      requiredLevel: 10
      playerRadius: 10
      spawnDistance: 150

  chat:
    prefix: "<color:#d30000><bold>nucleo</bold> <white>»</white></color>"
    publicFormat: "%vault_prefix% <white>%nucleo_nick%</white> <aqua>»</aqua> <reset><message>"
    mentionsFormat: "<color:#d30000><bold>@<player>"
    permissions:
      format: "nucleo.events.chatformat"
      mentions: "nucleo.events.mentions"
    adminChat:
      trigger: "#"
      format: "<color:#d30000><bold>AdminChat</bold> <white>%nucleo_nick%</white> <light_purple>»</light_purple> <reset><message>"
      permission: "nucleo.events.adminchat"

  worlds:
    lobby:
      name: "lobby"
      coords:
        x: 0.5
        y: 65.0
        z: 0.5
        yaw: 180.0
        pitch: 0.0

  environment:
    # Cada cuántos ticks se recalcula la temperatura corporal (20 ticks = 1 s)
    periodTicks: 40
    # Qué fracción de la diferencia con el entorno recupera el cuerpo en cada ciclo (0-1)
    inertia: 0.15
    # Temperatura base (°C) en el overworld según el mes real
    monthlyBase:
      january: 4.0
      february: 4.0
      march: 18.0
      april: 18.0
      may: 18.0
      june: 26.0
      july: 34.0
      august: 34.0
      september: 26.0
      october: 18.0
      november: 18.0
      december: 4.0
    biome:
      # Modificador = (temperatura vanilla del bioma - neutral) * factor
      neutral: 0.8
      factor: 10.0
      # Sustituye el modificador calculado para un bioma concreto (°C)
      overrides:
        desert: 12.0
        snowy_plains: -10.0
    altitude:
      seaLevel: 64
      blocksPerDegree: 15.0
    # Modificadores aplicados según lo expuesto al cielo que esté el jugador
    night: -6.0
    rain: -4.0
    snow: -6.0
    water: -8.0
    # °C extra por cada nivel de luz emitida por bloques (fuego, lava, antorchas...)
    blockLightFactor: 0.5
    netherBase: 45.0
    endBase: -15.0
    insulation:
      # °C que abriga cada pieza de cuero con frío
      leatherPerPiece: 2.5
      # °C que añade cada pieza metálica con calor
      metalHeatPerPiece: 1.0
    thresholds:
      freezing: -2.0
      cold: 5.0
      hot: 35.0
      scorching: 42.0
    effects:
      freezeGainPerCycle: 20
      hotExhaustion: 0.5
      scorchingExhaustion: 1.5

  sequentialCommands:
    _example:
      - command: "say example"
        delay: 0
      - command: "say delay"
        delay: 2

blacklist:
  nicks: []
  commands:
    - /minecraft:me
  recipes: []

file-version: 3